name: CI Segmented Domains

on:
  push:
  pull_request:

jobs:
  procurement-logistics-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime and UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest PyQt5 fastapi starlette httpx anyio
      - name: Compile Python sources
        run: |
          cd pos_spj_v13.4
          python -m compileall .
      - name: Validate architecture
        run: |
          cd pos_spj_v13.4
          python -m pytest -q \
            tests/architecture/test_procurement*.py \
            tests/architecture/test_logistics*.py \
            tests/architecture/test_purchasing*.py \
            tests/architecture/test_direct_purchase_ui_guardrails.py \
            tests/architecture/test_purchase_inventory_canonical_route.py
      - name: Validate role and domain unit tests
        run: |
          cd pos_spj_v13.4
          python -m pytest tests/unit/procurement tests/unit/logistics -q
      - name: Validate Procurement and Logistics integration / E2E
        run: |
          cd pos_spj_v13.4
          python -m pytest tests/integration/procurement tests/integration/logistics -q
      - name: Validate Purchasing visual contracts
        env:
          PURCHASING_VISUAL_ARTIFACTS: ${{ github.workspace }}/visual-artifacts
        run: |
          cd pos_spj_v13.4
          python -m pytest tests/ui/test_purchasing_visual_closure.py -q
      - name: Upload Purchasing visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchasing-visual-${{ github.run_id }}
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Validate Logistics PWA syntax and workflow rules
        run: |
          cd pos_spj_v13.4
          for file in frontend/web/logistics/*.js; do node --check "$file"; done
          node --test tests/pwa/*.test.mjs

  ventas:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest PyQt5 fastapi starlette httpx anyio
      - name: Run ventas-focused suite
        run: |
          ./scripts/ci/run_domain_tests.sh ventas

  ui:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest PyQt5 fastapi starlette httpx anyio
      - name: Run UI-focused suite
        run: |
          ./scripts/ci/run_domain_tests.sh ui

  api:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest PyQt5 fastapi starlette httpx anyio
      - name: Run API-focused suite (exclude UI/GL tests)
        run: |
          ./scripts/ci/run_domain_tests.sh api
