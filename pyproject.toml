[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spj-whatsapp-runtime"
version = "1.0.0"
description = "SPJ backend and independently executable WhatsApp channel"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["pos_spj_v13.4", "."]
include = ["backend", "backend.*", "migrations", "migrations.*", "whatsapp_service", "whatsapp_service.*"]
exclude = ["whatsapp_service.tests", "whatsapp_service.tests.*"]
namespaces = true
